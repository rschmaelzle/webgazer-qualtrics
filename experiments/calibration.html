<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Tracking Calibration</title>

  <!-- jsPsych Core -->
  <script src="https://unpkg.com/jspsych@8.2.2"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" />

  <!-- jsPsych Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>

  <!-- Gaze Adapter -->
  <script src="../dist/gaze-adapter.bundle.umd.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
  </style>
</head>

<body>
  <div id="jspsych-target"></div>

  <script>
    // ------------------------------------------------------------------ settings
    var MAX_ATTEMPTS = 2;        // calibrate up to this many times ...
    var THRESHOLD = 0.08;        // ... until accuracy (RMSE / window diagonal) is at or below this

    // Accuracy check: same dots and procedure for the check after calibration and the
    // post-video drift check ("validate" message from the survey page).
    var CHECK_POINTS = [
      { x: 0.3, y: 0.3 }, { x: 0.7, y: 0.3 }, { x: 0.5, y: 0.5 }, { x: 0.3, y: 0.7 }, { x: 0.7, y: 0.7 }
    ];
    var SETTLE_MS = 1000;        // time to move the eyes to the dot before measuring
    var COLLECT_MS = 1000;       // time over which gaze is collected per dot
    var MIN_SAMPLES = 3;         // valid samples needed per dot

    var isInIframe = window.parent !== window;
    var calibration_attempts = 0;
    var final_validation_data = null;
    var is_tracking_available = false;
    var adapter = new GazeAdapter();

    // All gaze samples go through here, so several consumers can listen at once.
    var sampleHandlers = [];
    adapter.onSample(function (sample) {
      sampleHandlers.forEach(function (h) { h(sample); });
    });

    // With no face (or closed eyes) in view the tracker returns the exact window centre.
    function isNoFace(s) {
      return Math.abs(s.x - window.innerWidth / 2) < 0.01 && Math.abs(s.y - window.innerHeight / 2) < 0.01;
    }

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function median(a) {
      var s = a.slice().sort(function (p, q) { return p - q; });
      return s[Math.floor(s.length / 2)];
    }

    // Shows CHECK_POINTS one after another (no clicks, so the model is not changed) and
    // measures the distance between the median gaze and each dot.
    async function measureAccuracy() {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;' +
        'background:rgba(0,0,0,0.5);cursor:none;';
      var dot = document.createElement('div');
      dot.style.cssText = 'position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;' +
        'background:#1e6fff;border:3px solid #fff;box-sizing:border-box;transition:all 0.4s;';
      overlay.appendChild(dot);
      document.body.appendChild(overlay);

      var buffer = null;
      var handler = function (s) { if (buffer) buffer.push(s); };
      sampleHandlers.push(handler);

      var errors = [], offsets = [], nValid = [];
      for (var i = 0; i < CHECK_POINTS.length; i++) {
        var p = CHECK_POINTS[i];
        dot.style.left = (p.x * 100) + '%';
        dot.style.top = (p.y * 100) + '%';
        await wait(SETTLE_MS);
        buffer = [];
        await wait(COLLECT_MS);
        var valid = buffer.filter(function (s) { return !isNoFace(s); });
        buffer = null;
        nValid.push(valid.length);
        if (valid.length >= MIN_SAMPLES) {
          var dx = median(valid.map(function (s) { return s.x; })) - p.x * window.innerWidth;
          var dy = median(valid.map(function (s) { return s.y; })) - p.y * window.innerHeight;
          errors.push(Math.round(Math.sqrt(dx * dx + dy * dy)));
          offsets.push([Math.round(dx), Math.round(dy)]);   // gaze minus dot: + = right / below
        } else {
          errors.push(null);                    // no face / too few samples at this dot
          offsets.push(null);
        }
      }

      sampleHandlers.splice(sampleHandlers.indexOf(handler), 1);
      document.body.removeChild(overlay);

      var measured = errors.filter(function (e) { return e !== null; });
      var diag = Math.sqrt(window.innerWidth * window.innerWidth + window.innerHeight * window.innerHeight);
      var rmsePx = measured.length >= 3
        ? Math.sqrt(measured.reduce(function (a, e) { return a + e * e; }, 0) / measured.length)
        : null;
      return {
        rmse: rmsePx === null ? null : rmsePx / diag,
        rmse_pixels: rmsePx === null ? null : Math.round(rmsePx),
        errors: errors,
        offsets: offsets,
        n_samples: nValid,
        validation_points: CHECK_POINTS.length,
        measured_points: measured.length,
        window_w: window.innerWidth,
        window_h: window.innerHeight
      };
    }

    var jsPsych = initJsPsych({
      on_finish: function () {
        var validation_data = final_validation_data;
        var offset_text = validation_data && validation_data.rmse !== null
          ? validation_data.rmse.toFixed(3) + ' (RMSE)'
          : 'Not available';
        document.querySelector('#jspsych-target').innerHTML =
          '<div style="text-align: center; padding: 50px; font-family: sans-serif;">' +
          '<h2>Calibration Complete!</h2>' +
          '<p>Accuracy: ' + offset_text + '</p>' +
          '<p>Calibration attempts: ' + calibration_attempts + '</p>' +
          '</div>';
      }
    });

    var timeline = [];

    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div style="text-align: center; padding: 20px; max-width: 700px; margin: 0 auto;">
          <h2>Eye Tracking Calibration</h2>
          <p>This study requires eye tracking. To get started, complete the eye tracking calibration.</p>
          <p><strong>Camera Permission Required:</strong> You will be asked to allow camera access and to complete a calibration task. This is necessary for eye tracking. Eye tracking does NOT record or save any video or pictures. Only the location of the screen you look at and timestamps will be saved.</p>
          <img src="ET_explained.png" alt="Eye tracking only records coordinates and timestamps, not video" style="max-width: 400px; margin: 20px auto; display: block;">
          <p>Follow the calibration instructions before advancing.</p>
          <p style="font-size: 0.9rem; color: #666; margin-top: 20px;">By completing the calibration, you agree for us to record what part of the screen you are looking at, at any given time in the duration of completing this study. If you decide to withdraw from this study, any information collected will not be used.</p>
          <p id="camera-status" style="color: #999; margin-top: 20px;">
            <em>Initializing camera...</em>
          </p>
        </div>
      `,
      choices: ['Continue'],
      on_load: async function () {
        const continueBtn = document.querySelector('.jspsych-btn');
        if (continueBtn) continueBtn.disabled = true;

        try {
          await adapter.init();
          is_tracking_available = true;
          document.getElementById('camera-status').innerHTML =
            '<span style="color: #2ecc71;">Camera ready</span>';
        } catch (e) {
          console.error('[Calibration] Camera initialization failed:', e);
          is_tracking_available = false;
          document.getElementById('camera-status').innerHTML = '';
        }

        if (continueBtn) continueBtn.disabled = false;
      }
    });

    var setup_instructions = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div style="text-align: center; padding: 20px; max-width: 640px; margin: 0 auto;">
          <h3>Before we start</h3>
          <p>Eye tracking with a webcam only works well if your head stays in the same place.
             Please set up now and keep this position until the end of the video:</p>
          <ul style="text-align: left; margin: 20px auto; display: inline-block; line-height: 1.6;">
            <li><strong>Light on your face</strong> - no bright window or lamp behind you</li>
            <li>Sit about an arm's length from the screen, <strong>face centered</strong> in front of the camera</li>
            <li><strong>Keep your head still</strong> - move only your eyes; don't lean in or back</li>
            <li><strong>Stay on this page</strong> until the video has ended - no other tabs or programs (e-mail, chat, phone)</li>
            <li>Glasses are fine; please avoid covering your face with your hands</li>
          </ul>
        </div>
      `,
      choices: ['I am ready']
    };
    timeline.push({ timeline: [setup_instructions], conditional_function: function () { return is_tracking_available; } });

    var calibration_instructions = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div style="text-align: center; padding: 20px; max-width: 600px; margin: 0 auto;">
          <h3>Calibration Instructions</h3>
          <p>Dots will appear at different positions on your screen.</p>
          <p><strong>Please:</strong></p>
          <ul style="text-align: left; margin: 20px auto; display: inline-block;">
            <li>Look directly at each dot until it moves on</li>
            <li>Use your eyes to look at the dots, not your head</li>
            <li>Green dots calibrate, blue dots then check the accuracy</li>
          </ul>
          <p style="color: #666; font-size: 14px; margin-top: 20px;">
            This takes about 30 seconds.
          </p>
        </div>
      `,
      choices: ['Begin Calibration']
    };

    var retry_message = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function () {
        return `
          <div style="text-align: center; padding: 50px 40px; max-width: 600px; margin: 0 auto;">
            <p style="font-size: 1.1rem; color: #333; line-height: 1.6;">
              The eye tracking is not accurate enough yet.
            </p>
            <p style="color: #555; line-height: 1.6;">
              Please check that your face is well lit and centered, keep your head still,
              and follow each dot with your eyes. Let's try one more time.
            </p>
          </div>`;
      },
      choices: ['Try again']
    };

    var calibrate = {
      type: jsPsychCallFunction,
      async: true,
      func: async function (done) {
        try {
          await adapter.calibrate();                 // green dots (model) + its own quick check
          calibration_attempts++;
          final_validation_data = await measureAccuracy();   // blue dots, measured as in the post-video check
        } catch (e) {
          console.error('Calibration failed:', e);
        }
        done();
      }
    };

    function calibrationGood() {
      var r = final_validation_data && final_validation_data.rmse;
      return r !== null && r !== undefined && r <= THRESHOLD;
    }

    timeline.push({
      timeline: [
        { timeline: [retry_message], conditional_function: function () { return calibration_attempts > 0; } },
        { timeline: [calibration_instructions], conditional_function: function () { return calibration_attempts === 0; } },
        calibrate
      ],
      conditional_function: function () { return is_tracking_available; },
      loop_function: function () {
        return is_tracking_available && calibration_attempts < MAX_ATTEMPTS && !calibrationGood();
      }
    });

    timeline.push({
      type: jsPsychHtmlButtonResponse,
      stimulus: '<h3>Calibration Complete!</h3><p>Proceeding...</p>',
      choices: [],
      trial_duration: 1000
    });

    timeline.push({
      type: jsPsychCallFunction,
      async: true,
      func: async function (done) {
        if (is_tracking_available) {
          try {
            await adapter.start();
            initTrackingMode();
          } catch (e) {
            console.error('[Calibration] Error starting adapter:', e);
          }
        }

        if (isInIframe) {
          window.parent.postMessage({
            type: 'calibration-complete',
            average_offset: final_validation_data ? final_validation_data.rmse : null,
            recalibrated: calibration_attempts > 1,
            calibration_attempts: calibration_attempts,
            calibration_good: calibrationGood(),
            validation_data: final_validation_data,
            model_key: 'webeyetrack_model_' + Date.now(),
            tracking_available: is_tracking_available
          }, '*');
        }

        done();
      }
    });

    if (isInIframe) {
      timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: '<div style="text-align: center; color: #999;">Eye tracking active</div>',
        choices: [],
        trial_duration: null,
        on_load: function () {
          setTimeout(() => {
            const el = document.querySelector('#jspsych-html-button-response-stimulus');
            if (el) el.style.display = 'none';
          }, 1000);
        }
      });
    } else {
      timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `
          <div style="text-align: center; padding: 40px;">
            <h2 style="color: #2ecc71;">Eye Tracking Active</h2>
            <p style="margin: 20px 0;">Calibration complete and tracker is running.</p>
            <p style="color: #666; font-size: 14px;">In Qualtrics, this iframe would remain hidden while tracking continues.</p>
          </div>
        `,
        choices: ['Close Window']
      });
    }

    jsPsych.run(timeline);

    var isTracking = false;
    var viewportOffset = { scrollX: 0, scrollY: 0 };

    function initTrackingMode() {
      isTracking = true;

      // Red gaze dot only when this page is opened on its own (in the survey it would be
      // visible during the post-video accuracy check and give feedback).
      var gazeDot = null;
      if (!isInIframe) {
        gazeDot = document.createElement('div');
        gazeDot.style.cssText = 'position:fixed;width:20px;height:20px;background:red;border-radius:50%;' +
          'pointer-events:none;z-index:9999;transform:translate(-50%,-50%);display:none;';
        document.body.appendChild(gazeDot);
      }

      sampleHandlers.push(function (sample) {
        if (gazeDot) {
          gazeDot.style.display = 'block';
          gazeDot.style.left = sample.x + 'px';
          gazeDot.style.top = sample.y + 'px';
        }
        if (!isTracking || !isInIframe) return;
        window.parent.postMessage({
          type: 'gaze-data',
          timestamp: sample.perf_t,
          x: sample.x + viewportOffset.scrollX,
          y: sample.y + viewportOffset.scrollY
        }, '*');
      });

      if (isInIframe) {
        window.parent.postMessage({ type: 'tracking-ready' }, '*');
      }
    }

    var validating = false;
    window.addEventListener('message', function (event) {
      var data = event.data || {};
      switch (data.type) {
        case 'start-tracking':
          isTracking = true;
          break;
        case 'pause-tracking':
          isTracking = false;
          break;
        case 'viewport-update':
          viewportOffset.scrollX = data.scrollX || 0;
          viewportOffset.scrollY = data.scrollY || 0;
          break;
        case 'validate':                 // post-video accuracy (drift) check
          if (validating) break;
          validating = true;
          (is_tracking_available ? measureAccuracy() : Promise.resolve(null)).then(function (res) {
            validating = false;
            window.parent.postMessage({ type: 'validation-result', result: res }, '*');
          });
          break;
      }
    });

  </script>
</body>

</html>
